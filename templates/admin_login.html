<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ترو شيلد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            background: #f5f6fa;
            text-align: center;
            padding-top: 80px;
        }
        .login-box {
            background: white;
            padding: 30px;
            margin: auto;
            width: 350px;
            box-shadow: 0 0 10px #ccc;
            border-radius: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1a252f;
        }
        .alert {
            margin-top: 10px;
            padding: 10px;
            background: #ffdddd;
            border: 1px solid #ffbbbb;
            color: #c0392b;
            border-radius: 6px;
        }
        a {
            color: #444;
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>تسجيل دخول الأدمن</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_authenticate') }}">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>

        <a href="{{ url_for('warranty_activation') }}">العودة للصفحة الرئيسية</a>
    </div>

</body>
</html>
